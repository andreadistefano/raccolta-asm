name: Publish Docker Image

on:
  workflow_run:
    workflows: ["Publish to Docker Hub"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: docker.io
  IMAGE_NAME: raccolta-asm

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --force --tags origin '+refs/tags/*:refs/tags/*'

      - name: Extract version from release tag
        id: tag_version
        run: |
          VERSION=$(git tag --points-at HEAD | grep -E '^v[0-9]+' | head -n 1 | sed 's/^v//')
          if [ -z "$VERSION" ]; then
            echo "No release tag found on HEAD" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0'

      - name: Restore dependencies
        run: dotnet restore

      - name: Test
        run: dotnet test Tests/RaccoltaASM.Tests/RaccoltaASM.Tests.csproj -c Release --no-restore -p:Version="${{ steps.tag_version.outputs.VERSION }}"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ vars.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.tag_version.outputs.VERSION }}
            ${{ env.REGISTRY }}/${{ vars.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ steps.tag_version.outputs.VERSION }}
